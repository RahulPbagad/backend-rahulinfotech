name: Backend CI/CD (Development)

on:
  workflow_dispatch:

  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:

    name: Build & Push Backend Image

    runs-on: ubuntu-latest

    environment:
      name: Development

    env:
      ECR_REPOSITORY: backend-rahulinfotech

    steps:

      ############################################################
      # Checkout Repository
      ############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # DEBUG GITHUB CONTEXT
      ############################################################

      - name: Debug GitHub Context
        run: |
          echo "Repository = ${{ github.repository }}"
          echo "Ref = ${{ github.ref }}"
          echo "Ref Name = ${{ github.ref_name }}"
          echo "Event = ${{ github.event_name }}"
          echo "Environment = Development"

      ############################################################
      # DEBUG ROLE ARN
      ############################################################

      - name: Debug Role ARN
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "Role ARN length: ${#ROLE}"

      ############################################################
      # CONFIGURE AWS CREDENTIALS
      ############################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-backend

      ############################################################
      # VERIFY AWS LOGIN
      ############################################################

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # ...rest of your workflow remains unchanged...