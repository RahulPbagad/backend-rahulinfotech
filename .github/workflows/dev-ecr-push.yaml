name: Backend CI/CD (Development)

on:
  workflow_dispatch:

  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:

    name: Build & Push Backend Image

    runs-on: ubuntu-latest

    environment:
      name: Development

    env:
      ECR_REPOSITORY: backend-rahulinfotech

    steps:

      ############################################################
      # Checkout Repository
      ############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # Debug GitHub Context
      ############################################################

      - name: Debug GitHub Context
        run: |
          echo "Repository = ${{ github.repository }}"
          echo "Ref = ${{ github.ref }}"
          echo "Ref Name = ${{ github.ref_name }}"
          echo "Event = ${{ github.event_name }}"
          echo "Environment = Development"

      ############################################################
      # Debug Role ARN
      ############################################################

      - name: Debug Role ARN
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "Role ARN length: ${#ROLE}"
          echo "Role ARN: ***"

      ############################################################
      # Check OIDC Token
      ############################################################

      - name: Check OIDC Token Availability
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL"

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC TOKEN NOT AVAILABLE"
            exit 1
          else
            echo "OIDC TOKEN AVAILABLE"
          fi

      ############################################################
      # Decode OIDC Token
      ############################################################

      - name: Decode OIDC Token
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "================ JWT PAYLOAD ================"

          echo "$TOKEN" \
            | cut -d '.' -f2 \
            | tr '_-' '/+' \
            | base64 -d 2>/dev/null || true

          echo
          echo "============================================="

      ############################################################
      # Configure AWS Credentials
      ############################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-backend

      ############################################################
      # Verify AWS Identity
      ############################################################

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      ############################################################
      # Login to Amazon ECR
      ############################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ############################################################
      # Build Docker Image
      ############################################################

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REPOSITORY:latest \
            .

      ############################################################
      # Tag Docker Image
      ############################################################

      - name: Tag Docker Image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

          docker tag \
            $ECR_REPOSITORY:latest \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest

      ############################################################
      # Push Docker Image
      ############################################################

      - name: Push Docker Image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest